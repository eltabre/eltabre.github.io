name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Lets you re-run a deploy from the Actions tab without pushing anything.
  workflow_dispatch:

# GITHUB_TOKEN permissions the Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Queued rather than cancelled, so a run that is already
# publishing is never interrupted half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Installs dependencies, runs `astro build`, and uploads dist/ as the
      # Pages artifact. Astro maintain this action, so it tracks their build.
      - name: Build
        uses: withastro/action@v3
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
