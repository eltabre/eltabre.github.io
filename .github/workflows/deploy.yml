name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Lets you re-run a deploy from the Actions tab without pushing anything.
  workflow_dispatch:

# GITHUB_TOKEN permissions the Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Queued rather than cancelled, so a run that is already
# publishing is never interrupted half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Astro 7 needs >=22.12; the runner default is older. `cache: npm` reuses
      # the download cache between runs.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `ci` not `install` — installs exactly what package-lock.json pins, and
      # fails if the lockfile is out of sync.
      - name: Install
        run: npm ci

      # The gate. `astro build` does not typecheck, so without this a type
      # error would deploy happily.
      - name: Typecheck
        run: npx astro check

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
